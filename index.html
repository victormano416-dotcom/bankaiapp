<!doctype html>
<html lang="pt-BR" data-theme="obsidian" class="antialiased">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>BANKAI</title>
    <meta name="description" content="Controle de caixa pessoal: entradas, gastos e faturas." />
    <meta name="theme-color" content="#09090b" />
    <meta name="apple-mobile-web-app-title" content="BANKAI" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500&display=swap" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("bankai-theme");
          var ok = ["obsidian", "paper", "aurora", "forest", "sand"];
          if (ok.indexOf(t) >= 0) document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
